<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生き物好きタイプ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #2d4a2d;
    --moss: #4a7c59;
    --leaf: #7ab648;
    --sun: #f2c94c;
    --earth: #8b6349;
    --sand: #f5efe0;
    --sky: #a8d5e2;
    --ink: #1a2e1a;
    --mist: #e8f0e8;
    --white: #ffffff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--sand);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content:'';
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(74,124,89,0.07) 0%, transparent 50%),
      radial-gradient(circle at 85% 75%, rgba(168,213,226,0.10) 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%234a7c59' fill-opacity='0.035'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
    pointer-events:none; z-index:0;
  }
  #app { position:relative; z-index:1; max-width:720px; margin:0 auto; padding:2rem 1.2rem 5rem; }

  /* HEADER */
  .site-header { text-align:center; padding:2.5rem 0 2rem; animation:fadeDown .8s ease both; }
  .site-header .paw { font-size:2.8rem; display:block; margin-bottom:.4rem; }
  .site-header h1 { font-family:'Zen Kurenaido',serif; font-size:clamp(2rem,6vw,3rem); color:var(--forest); letter-spacing:.05em; }
  .site-header p { margin-top:.6rem; font-size:.9rem; color:var(--moss); font-weight:300; }

  /* PROGRESS */
  .progress-wrap { margin-bottom:1.8rem; animation:fadeUp .6s .2s ease both; }
  .progress-label { display:flex; justify-content:space-between; font-size:.78rem; color:var(--moss); margin-bottom:.4rem; }
  .progress-bar { height:6px; background:rgba(74,124,89,.15); border-radius:99px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--leaf),var(--moss)); border-radius:99px; transition:width .5s cubic-bezier(.4,0,.2,1); }

  /* CARD */
  .question-card { background:#fff; border-radius:20px; padding:2rem 1.8rem; box-shadow:0 4px 24px rgba(45,74,45,.10),0 1px 4px rgba(45,74,45,.06); margin-bottom:1.4rem; animation:fadeUp .5s ease both; }
  .q-number { font-size:.72rem; font-weight:700; letter-spacing:.12em; color:var(--leaf); text-transform:uppercase; margin-bottom:.6rem; }
  .q-text { font-family:'Zen Kurenaido',serif; font-size:clamp(1.05rem,3vw,1.25rem); color:var(--forest); line-height:1.7; margin-bottom:1.6rem; }

  /* CHOICES */
  .choices { display:flex; flex-direction:column; gap:.75rem; }
  .choice-btn { display:flex; align-items:center; gap:.8rem; padding:.85rem 1.2rem; background:var(--mist); border:2px solid transparent; border-radius:12px; cursor:pointer; font-family:'Noto Sans JP',sans-serif; font-size:.92rem; color:var(--ink); text-align:left; transition:all .2s ease; line-height:1.5; }
  .choice-btn:hover { background:#fff; border-color:var(--leaf); transform:translateX(4px); box-shadow:0 3px 12px rgba(74,124,89,.15); }
  .choice-btn.selected { background:var(--forest); border-color:var(--forest); color:#fff; }
  .choice-icon { font-size:1.4rem; flex-shrink:0; }

  /* NAV */
  .nav-area { display:flex; justify-content:space-between; align-items:center; gap:1rem; animation:fadeUp .5s .1s ease both; }
  .btn { padding:.75rem 2rem; border-radius:99px; font-family:'Noto Sans JP',sans-serif; font-size:.9rem; font-weight:700; cursor:pointer; transition:all .2s ease; border:none; }
  .btn-primary { background:linear-gradient(135deg,var(--leaf),var(--moss)); color:#fff; box-shadow:0 4px 16px rgba(74,124,89,.3); }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(74,124,89,.4); }
  .btn-primary:disabled { opacity:.35; cursor:not-allowed; transform:none; }
  .btn-ghost { background:transparent; color:var(--moss); border:2px solid var(--moss); }
  .btn-ghost:hover { background:var(--mist); }

  /* SCREENS */
  .screen { background:#fff; border-radius:24px; padding:3rem 2rem; text-align:center; box-shadow:0 4px 32px rgba(45,74,45,.10); animation:fadeUp .7s ease both; }
  .screen h2 { font-family:'Zen Kurenaido',serif; font-size:clamp(1.6rem,5vw,2.2rem); color:var(--forest); margin-bottom:1rem; line-height:1.4; }
  .screen p { color:var(--moss); line-height:1.8; margin-bottom:.6rem; }
  .screen .emoji-big { font-size:4rem; display:block; margin-bottom:1rem; }

  /* RESULT */
  .result-illust { width:200px; height:200px; margin:0 auto 1.2rem; display:block; filter:drop-shadow(0 8px 24px rgba(45,74,45,.18)); animation:float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .result-type-badge { display:inline-block; background:var(--forest); color:#fff; font-family:'Zen Kurenaido',serif; font-size:1.6rem; padding:.5rem 1.6rem; border-radius:99px; margin-bottom:.4rem; letter-spacing:.06em; }
  .result-code { font-size:.75rem; color:#bbb; letter-spacing:.12em; margin-bottom:1rem; }
  .result-desc { background:var(--mist); border-radius:16px; padding:1.4rem; text-align:left; margin:1rem 0; }
  .result-desc h3 { font-family:'Zen Kurenaido',serif; color:var(--moss); margin-bottom:.5rem; font-size:1rem; }
  .result-desc p { font-size:.9rem; color:var(--ink); line-height:1.8; margin-bottom:0; }
  .traits { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.8rem; }
  .trait-tag { background:rgba(74,124,89,.12); color:var(--forest); border-radius:99px; padding:.3rem .9rem; font-size:.78rem; font-weight:700; }
  .axes { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; margin:1.2rem 0; }
  .axis-row { background:var(--mist); border-radius:12px; padding:.8rem 1rem; text-align:center; }
  .axis-label { font-size:.7rem; color:var(--moss); font-weight:700; letter-spacing:.05em; margin-bottom:.3rem; }
  .axis-value { font-family:'Zen Kurenaido',serif; font-size:1rem; color:var(--forest); }
  .compat-box { background:var(--mist); border-radius:12px; padding:1rem; margin-top:.8rem; text-align:left; }
  .compat-box h3 { font-family:'Zen Kurenaido',serif; color:var(--moss); font-size:.9rem; margin-bottom:.3rem; }
  .compat-box p { font-size:.85rem; color:var(--ink); }
  .share-area { margin-top:1.2rem; display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap; }
  .share-btn { padding:.6rem 1.4rem; border-radius:99px; font-size:.82rem; font-weight:700; border:none; cursor:pointer; transition:all .2s; }
  .share-x { background:#000; color:#fff; }
  .share-x:hover { opacity:.8; }
  .share-copy { background:var(--mist); color:var(--forest); border:2px solid var(--forest); }

  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeDown { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }

  @media(max-width:500px){
    .axes{grid-template-columns:1fr 1fr}
    .question-card{padding:1.4rem 1.2rem}
    .screen{padding:2rem 1.2rem}
    .result-illust{width:160px;height:160px}
  }
</style>
</head>

const TYPES = {
  WLOS:{name:"フィールド研究者タイプ",short:"WLOS",desc:"野生の大地に一人踏み込み、双眼鏡とノートを片手にデータを積み重ねる。観察眼は鋭く、誰も気づかない生態の断片に喜びを見出す。静けさこそが最高のフィールドだと信じている本格派。",traits:["データ重視","忍耐強い","孤独に強い","客観的","詳細志向"],compat:"バードウォッチャータイプ / 海洋研究者タイプ"},

  WLCS:{name:"一匹狼の保護活動家タイプ",short:"WLCS",desc:"現場主義の行動派。野生動物の保護に強い信念を持ち、泥臭い活動を単独で黙々と続ける。脚光より結果を選ぶ、孤高の存在。その背中が、いつか多くの人を動かす。",traits:["行動力","強い信念","実務派","孤高","頑固さ(良い意味で)"],compat:"野生動物レンジャータイプ / 動物保護ボランティアタイプ"},

  WACS:{name:"海洋研究者タイプ",short:"WACS",desc:"深海から大空まで、スケールの大きな生態系を一人静かに調査する研究者。孤独な調査船の上でも使命感が揺らぐことはない。誰も知らない海の真実を、データで解き明かすことに全てを賭けている。",traits:["スケール感","探究心","タフさ","孤独耐性","集中力"],compat:"バードウォッチャータイプ / 一匹狼の保護活動家タイプ"},

// ═══════════════════════════════════
// アプリ状態
// ═══════════════════════════════════
let state = { screen:"start", current:0, answers:{} };

function getKey() {
  const s={W:0,P:0,L:0,A:0,O:0,C:0,S:0,G:0};
  QUESTIONS.forEach(q=>{const a=state.answers[q.id];if(a)s[a]++;});
  return (s.W>=s.P?"W":"P")+(s.L>=s.A?"L":"A")+(s.O>=s.C?"O":"C")+(s.S>=s.G?"S":"G");
}

// ═══════════════════════════════════
// レンダリング
// ═══════════════════════════════════
function render(){
  const el=document.getElementById("main");
  if(state.screen==="start") el.innerHTML=renderStart();
  else if(state.screen==="quiz") el.innerHTML=renderQuiz();
  else el.innerHTML=renderResult();
  bindEvents();
}

function renderStart(){return`
<div class="screen">
  <span class="emoji-big">🌿</span>
  <h2>あなたは何タイプのいきもの好き？</h2>
  <p>20問の質問に答えるだけで、<br>あなたのいきもの愛のスタイルがわかります。</p>
  <p style="font-size:.8rem;color:#aaa;margin-top:.6rem;">所要時間：約3〜5分 / 全16タイプ</p>
  <br>
  <button class="btn btn-primary" id="startBtn" style="font-size:1rem;padding:.9rem 2.8rem;">🐾 スタート</button>
</div>`;}

function renderQuiz(){
  const q=QUESTIONS[state.current];
  const total=QUESTIONS.length;
  const pct=Math.round((state.current/total)*100);
  const answered=state.answers[q.id];
  return`
<div class="progress-wrap">
  <div class="progress-label"><span>質問 ${state.current+1} / ${total}</span><span>${pct}%</span></div>
  <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
</div>
<div class="question-card">
  <div class="q-number">Question ${state.current+1}</div>
  <div class="q-text">${q.text}</div>
  <div class="choices">
    ${q.choices.map(c=>`
    <button class="choice-btn ${answered===c.val?'selected':''}" data-val="${c.val}" data-qid="${q.id}">
      <span class="choice-icon">${c.icon}</span><span>${c.text}</span>
    </button>`).join('')}
  </div>
</div>
<div class="nav-area">
  <button class="btn btn-ghost" id="prevBtn" ${state.current===0?'style="visibility:hidden"':''}>← もどる</button>
  <button class="btn btn-primary" id="nextBtn" ${!answered?'disabled':''}>
    ${state.current===total-1?'結果を見る 🎉':'つぎへ →'}
  </button>
</div>`;}

function renderResult(){
  const key=getKey();
  const t=TYPES[key]||TYPES["WLOS"];
  const svg=ILLUSTRATIONS[key]||ILLUSTRATIONS["WLOS"];
  return`
<div class="screen">
  <div class="result-illust">${svg}</div>
  <div class="result-type-badge">${t.name}</div>
  <div class="result-code">${key}</div>
  <div class="result-desc">
    <h3>📖 どんなタイプ？</h3>
    <p>${t.desc}</p>
    <div class="traits">${t.traits.map(tr=>`<span class="trait-tag">${tr}</span>`).join('')}</div>
  </div>
  <div class="axes">
    ${ax("関わり方",key[0]==="W"?"🌿 野生志向":"🐾 共生志向")}
    ${ax("フィールド",key[1]==="L"?"🌲 地上・陸":"🌊 海・空")}
    ${ax("スタンス",key[2]==="O"?"📷 観察・記録":"🤝 保護・行動")}
    ${ax("スタイル",key[3]==="S"?"🎒 単独・静か":"👥 仲間と一緒")}
  </div>
  <div class="compat-box">
    <h3>💫 相性の良いタイプ</h3>
    <p>${t.compat}</p>
  </div>
  <div class="share-area">
    <button class="share-btn share-x" id="shareX">𝕏 でシェア</button>
    <button class="share-btn share-copy" id="shareCopy">📋 コピー</button>
    <button class="btn btn-ghost" id="retryBtn" style="padding:.6rem 1.4rem;font-size:.82rem;">もう一度やる</button>
  </div>
</div>`;}

function ax(label,val){return`<div class="axis-row"><div class="axis-label">${label}</div><div class="axis-value">${val}</div></div>`;}

// ═══════════════════════════════════
// イベント
// ═══════════════════════════════════
function bindEvents(){
  document.getElementById("startBtn")?.addEventListener("click",()=>{state.screen="quiz";state.current=0;render();});
  document.getElementById("prevBtn")?.addEventListener("click",()=>{if(state.current>0){state.current--;render();}});
  document.getElementById("nextBtn")?.addEventListener("click",()=>{
    if(state.current<QUESTIONS.length-1){state.current++;render();}
    else{state.screen="result";render();}
  });
  document.querySelectorAll(".choice-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{state.answers[+btn.dataset.qid]=btn.dataset.val;render();});
  });
  document.getElementById("retryBtn")?.addEventListener("click",()=>{state={screen:"start",current:0,answers:{}};render();});
  document.getElementById("shareX")?.addEventListener("click",()=>{
    const t=TYPES[getKey()];
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(`私は「${t.name}」でした！\n#生き物好きタイプ診断`)}`, "_blank");
  });
  document.getElementById("shareCopy")?.addEventListener("click",()=>{
    const t=TYPES[getKey()];
    navigator.clipboard.writeText(`私は「${t.name}」でした！ #生き物好きタイプ診断`);
    const b=document.getElementById("shareCopy");
    b.textContent="✅ コピーしました";setTimeout(()=>b.textContent="📋 コピー",2000);
  });
}

render();
</script>
</body>
</html>
